{% extends 'base.html' %}

{% block title %}Editar Producto{% endblock %}
{% block nav_productos %}active{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-edit text-warning"></i> Editar Producto</h2>
        <a href="{% url 'inventario:listar_productos' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Volver al Listado
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Nombre del Producto</label>
                        <input type="text" name="nombre_producto" class="form-control" value="{{ producto.nombre_producto }}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Precio de Venta</label>
                        <input type="number" name="precio_producto" class="form-control" value="{{ producto.precio_producto }}" min="1" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Categoría</label>
                        <select name="categoria" class="form-select">
                            <option value="">-- Seleccionar categoría (opcional) --</option>
                            {% for cat in categorias %}
                                <option value="{{ cat.id }}" {% if producto.categoria_id == cat.id %}selected{% endif %}>
                                    {{ cat.nombre_categoria }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="activo" id="activo" {% if producto.activo %}checked{% endif %}>
                        <label class="form-check-label" for="activo">Producto Activo</label>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-warning">
                        <i class="fas fa-save"></i> Actualizar Producto
                    </button>
                    <a href="{% url 'inventario:listar_productos' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
