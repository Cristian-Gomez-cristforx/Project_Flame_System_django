{% extends 'base.html' %}

{% block title %}Crear Insumo - FlameSystem{% endblock %}

{% block content %}
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h4 class="mb-0">Crear Nuevo Insumo</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">Nombre del Insumo</label>
                    <input type="text" name="nombre_insumo" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cantidad</label>
                    <input type="number" name="cantidad_insumo" class="form-control" min="1" required>
                </div>

                <!-- NUEVO: Unidad de medida -->
                <div class="mb-3">
                    <label class="form-label">Unidad de Medida</label>
                    <select name="unidad_medida" class="form-select" required>
                        <option value="" disabled selected>-- Selecciona una unidad --</option>
                        {% for valor, etiqueta in unidades %}
                            <option value="{{ valor }}">{{ etiqueta }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio de Compra ($)</label>
                    <input type="number" name="precio_insumo" class="form-control" min="1" required>
                </div>

                <button type="submit" class="btn btn-flame">Guardar Insumo</button>
                <a href="{% url 'inventario:listar_insumos' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
{% endblock %}
