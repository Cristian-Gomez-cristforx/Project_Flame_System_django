{% extends 'base.html' %}

{% block title %}Crear Bebida{% endblock %}
{% block nav_bebidas %}active{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-plus-circle text-info"></i> Crear Nueva Bebida</h2>
        <a href="{% url 'inventario:listar_bebidas' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Volver al Listado
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre de la Bebida</label>
                        <input type="text" name="nombre_bebida" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tamaño</label>
                        <select name="tamaño_bebida" class="form-select" required>
                            {% for value, label in tamaño_choices %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Cantidad en Stock</label>
                        <input type="number" name="cantidad_bebida" class="form-control" min="1" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Precio de Compra</label>
                        <input type="number" name="precio_compra" class="form-control" min="1" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Precio de Venta</label>
                        <input type="number" name="precio_venta" class="form-control" min="1" required>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-info">
                        <i class="fas fa-save"></i> Guardar Bebida
                    </button>
                    <a href="{% url 'inventario:listar_bebidas' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
