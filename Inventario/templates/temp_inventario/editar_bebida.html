{% extends 'base.html' %}

{% block title %}Editar Bebida{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-edit text-warning"></i> Editar Bebida</h2>
        <a href="{% url 'inventario:listar_bebidas' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Volver al Listado
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre de la Bebida</label>
                        <input type="text" name="nombre_bebida" class="form-control"
                               value="{{ bebida.nombre_bebida }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tamaño</label>
                        <select name="tamaño_bebida" class="form-select" required>
                            {% for value, label in tamaño_choices %}
                                <option value="{{ value }}"
                                    {% if value == bebida.tamaño_bebida %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Cantidad en Stock</label>
                        <input type="number" name="cantidad_bebida" class="form-control"
                               value="{{ bebida.cantidad_bebida }}" min="1" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Precio de Compra</label>
                        <input type="number" name="precio_compra" class="form-control"
                               value="{{ bebida.precio_compra }}" min="1" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Precio de Venta</label>
                        <input type="number" name="precio_venta" class="form-control"
                               value="{{ bebida.precio_venta }}" min="1" required>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-warning">
                        <i class="fas fa-save"></i> Actualizar Bebida
                    </button>
                    <a href="{% url 'inventario:listar_bebidas' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
