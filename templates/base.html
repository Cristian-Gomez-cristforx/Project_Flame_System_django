<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlameSystem - {% block title %}Inventario{% endblock %}</title>
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/flame.css' %}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            
            <!-- SIDEBAR -->
            <div class="col-md-3 col-lg-2 sidebar p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold">FlameSystem</h3>
                    <small class="opacity-75">ROL: ADMINISTRADOR</small>
                </div>
                
                <div class="mb-4">
                    <input type="text" class="form-control" placeholder="Buscar...">
                </div>
                
                <a href="#" class="nav-link d-block">Gestión pedidos</a>
                <a href="#" class="nav-link d-block">Reportes</a>
                <a href="{% url 'inventario:inventario' %}" class="nav-link d-block">Inventario</a>
                <a href="{% url 'inventario:listar_mermas' %}" class="nav-link d-block">
                <i class="fas fa-exclamation-triangle me-2"></i> Mermas</a>
                <a href="#" class="nav-link d-block">Gestión de usuarios</a>
                
                <div class="mt-auto pt-5">
                    <a href="#" class="btn btn-light w-100">Cerrar Sesión</a>
                </div>
            </div>

            <!-- CONTENIDO PRINCIPAL -->
            <div class="col-md-9 col-lg-10 main-content p-4">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
